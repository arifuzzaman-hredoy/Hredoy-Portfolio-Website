name: Go CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Format check
        working-directory: backend
        shell: bash
        run: |
          files="$(find . -name '*.go' -not -path './vendor/*')"
          test -z "$(gofmt -l $files)"

      - name: Verify dependencies
        working-directory: backend
        run: go mod verify

      - name: Vet
        working-directory: backend
        run: go vet ./...

      - name: Test
        working-directory: backend
        run: go test ./...

      - name: Build binary
        working-directory: backend
        run: go build -o /tmp/portfolio ./cmd/portfolio

      - name: Validate Docker Compose
        run: docker compose -f devops/docker-compose.yml config --quiet

      - name: Build Docker image
        run: docker build -f devops/docker/Dockerfile -t hredoy-portfolio:ci .
