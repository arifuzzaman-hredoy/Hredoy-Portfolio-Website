name: hredoy-portfolio-website

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolio}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - portfolio-net

  uploads-init:
    image: alpine:3.20
    command: ["sh", "-c", "chown -R 65532:65532 /uploads && chmod 755 /uploads"]
    volumes:
      - uploads_data:/uploads
    restart: "no"
    networks:
      - portfolio-net

  app:
    build:
      context: ..
      dockerfile: devops/docker/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: ${APP_PORT:-8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:-postgres://portfolio:portfolio@postgres:5432/portfolio?sslmode=disable}
      MIGRATION_PATH: ${MIGRATION_PATH:-file:///app/db/migrations}
      SITE_URL: ${SITE_URL:-https://oxytumzone.com}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      UPLOAD_DIR: /app/uploads
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-portfolio}
      REVALIDATE_URL: ${REVALIDATE_URL:-http://frontend:3000/api/revalidate}
      REVALIDATE_TOKEN: ${REVALIDATE_TOKEN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      CONTACT_NOTIFY_TO: ${CONTACT_NOTIFY_TO:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      uploads-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/portfolio", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped
    networks:
      - portfolio-net
    expose:
      - "8080"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        PORTFOLIO_BACKEND_URL: http://app:8080
    environment:
      NODE_ENV: production
      PORTFOLIO_BACKEND_URL: http://app:8080
      REVALIDATE_TOKEN: ${REVALIDATE_TOKEN:-}
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - portfolio-net
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - portfolio-net

volumes:
  postgres_data:
  uploads_data:

networks:
  portfolio-net:
    driver: bridge