worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  access_log /var/log/nginx/access.log combined;

  upstream portfolio_app {
    server app:8080;
  }

  upstream portfolio_web {
    server frontend:3000;
  }

  # Shared proxy headers for the Go backend.
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  server {
    listen 80;
    server_name localhost;

    client_max_body_size 0;

    location /healthz {
      proxy_pass http://portfolio_app/healthz;
    }

    location /readyz {
      proxy_pass http://portfolio_app/readyz;
    }

    # CMS JSON API served by the Go backend.
    location /api/ {
      proxy_pass http://portfolio_app;
    }

    # Admin panel served by the Go backend.
    location /super-admin {
      proxy_pass http://portfolio_app;
    }

    # Uploaded media served by the Go backend.
    location /uploads/ {
      proxy_pass http://portfolio_app;
    }

    # Next.js immutable static build assets (content-hashed chunks)
    location /_next/static/ {
      proxy_pass http://portfolio_web;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Public static assets with ?v= cache-busting query parameter
    location /assets/ {
      proxy_pass http://portfolio_web;
      add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # Everything else is the Next.js public site (HTML documents never cached).
    location / {
      proxy_pass http://portfolio_web;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
    }
  }
}